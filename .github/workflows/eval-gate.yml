name: eval-gate
on:
 pull_request:
permissions:
 id-token: write
 contents: read
jobs:
 eval:
 runs-on: ubuntu-latest
 services:
 qdrant:
 image: qdrant/qdrant:latest
 ports:
 - 6333:6333
 env:
 AWS_REGION: us-east-1
 PYTHONPATH: src
 QDRANT_URL: http://localhost:6333
 MODEL_CACHE: ./models
 PROMPT_VERSION: v2
 MODEL_ID: ${{ vars.MODEL_ID }}
 JUDGE_MODEL_ID: ${{ vars.JUDGE_MODEL_ID }}
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-python@v5
 with:
 python-version: "3.11"
 - uses: aws-actions/configure-aws-credentials@v4
 with:
 role-to-assume: ${{ secrets.AWS_EVAL_ROLE_ARN }}
 aws-region: us-east-1
 - name: Install dependencies
 run: |
 pip install -r requirements.txt -r evals/requirements.txt
 python -m spacy download en_core_web_lg
 - name: Wait for Qdrant and ingest the knowledge base
 run: |
 for i in $(seq 1 30); do curl -sf http://localhost:6333/readyz && break; sleep 2; done
 python src/rag/ingest.py
 - name: Run evals
 run: python evals/run_evals.py