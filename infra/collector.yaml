extensions:
 sigv4auth:
 region: us-east-1
 service: xray
receivers:
 otlp:
 protocols:
 http:
 endpoint: 0.0.0.0:4318
processors:
 batch: {}
exporters:
 otlphttp/openobserve:
 endpoint: http://openobserve.internal:5080/api/default
 headers:
 Authorization: "Basic ${env:O2_AUTH}"
 otlphttp/xray:
 traces_endpoint: https://xray.us-east-1.amazonaws.com/v1/traces
 auth:
 authenticator: sigv4auth
 debug:
 verbosity: basic
service:
 extensions: [sigv4auth]
 pipelines:
 traces:
 receivers: [otlp]
 processors: [batch]
 exporters: [otlphttp/openobserve, otlphttp/xray, debug]